<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 324"><defs><marker id="007878" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#007878"/></marker><marker id="9a5712" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#9a5712"/></marker><marker id="516575" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#516575"/></marker></defs><rect width="100%" height="100%" fill="#f5f9f8"/><text x="20" y="33" font-family="Arial,sans-serif" font-size="24" fill="#18394b" font-weight="700">2 × 2   |   Operand delivery and reduction</text><text x="20" y="72" font-family="Arial,sans-serif" font-size="21" fill="#18394b" font-weight="700">Parallel lanes</text><text x="20" y="95" font-family="Arial,sans-serif" font-size="14" fill="#18394b" font-weight="400">Each cell has its own 32-bit A/B pair.</text><rect x="70" y="139" width="42" height="32" rx="6" fill="#007878"/><text x="74" y="160" font-family="Arial,sans-serif" font-size="15" fill="white" font-weight="700">P0</text><rect x="130" y="139" width="42" height="32" rx="6" fill="#007878"/><text x="134" y="160" font-family="Arial,sans-serif" font-size="15" fill="white" font-weight="700">P1</text><rect x="70" y="199" width="42" height="32" rx="6" fill="#007878"/><text x="74" y="220" font-family="Arial,sans-serif" font-size="15" fill="white" font-weight="700">P2</text><rect x="130" y="199" width="42" height="32" rx="6" fill="#007878"/><text x="134" y="220" font-family="Arial,sans-serif" font-size="15" fill="white" font-weight="700">P3</text><text x="20" y="274" font-family="Arial,sans-serif" font-size="16" fill="#18394b" font-weight="700">All products → array accumulator</text><text x="20" y="298" font-family="Arial,sans-serif" font-size="14" fill="#18394b" font-weight="400">4 local 80-bit sums</text><text x="365" y="72" font-family="Arial,sans-serif" font-size="21" fill="#18394b" font-weight="700">Registered mesh</text><text x="365" y="95" font-family="Arial,sans-serif" font-size="14" fill="#18394b" font-weight="400">A moves east. B moves south.</text><path d="M396 154 L414 154" stroke="#007878" stroke-width="2" marker-end="url(#007878)"/><path d="M435 111 L435 138" stroke="#9a5712" stroke-width="2" marker-end="url(#9a5712)"/><text x="367" y="158" font-family="Arial,sans-serif" font-size="13" fill="#007878" font-weight="700">A0</text><text x="425" y="106" font-family="Arial,sans-serif" font-size="13" fill="#9a5712" font-weight="700">B0</text><rect x="415" y="139" width="42" height="32" rx="6" fill="#007878"/><text x="419" y="160" font-family="Arial,sans-serif" font-size="15" fill="white" font-weight="700">0,0</text><path d="M456 154 L474 154" stroke="#007878" stroke-width="2" marker-end="url(#007878)"/><path d="M495 111 L495 138" stroke="#9a5712" stroke-width="2" marker-end="url(#9a5712)"/><text x="485" y="106" font-family="Arial,sans-serif" font-size="13" fill="#9a5712" font-weight="700">B1</text><rect x="475" y="139" width="42" height="32" rx="6" fill="#526879"/><text x="479" y="160" font-family="Arial,sans-serif" font-size="15" fill="white" font-weight="700">0,1</text><path d="M396 214 L414 214" stroke="#007878" stroke-width="2" marker-end="url(#007878)"/><path d="M435 171 L435 198" stroke="#9a5712" stroke-width="2" marker-end="url(#9a5712)"/><text x="367" y="218" font-family="Arial,sans-serif" font-size="13" fill="#007878" font-weight="700">A1</text><rect x="415" y="199" width="42" height="32" rx="6" fill="#526879"/><text x="419" y="220" font-family="Arial,sans-serif" font-size="15" fill="white" font-weight="700">1,0</text><path d="M456 214 L474 214" stroke="#007878" stroke-width="2" marker-end="url(#007878)"/><path d="M495 171 L495 198" stroke="#9a5712" stroke-width="2" marker-end="url(#9a5712)"/><rect x="475" y="199" width="42" height="32" rx="6" fill="#007878"/><text x="479" y="220" font-family="Arial,sans-serif" font-size="15" fill="white" font-weight="700">1,1</text><text x="365" y="274" font-family="Arial,sans-serif" font-size="16" fill="#18394b" font-weight="700">Diagonal products → array accumulator</text><text x="365" y="298" font-family="Arial,sans-serif" font-size="14" fill="#18394b" font-weight="400">Gray cells also accumulate locally.</text></svg>