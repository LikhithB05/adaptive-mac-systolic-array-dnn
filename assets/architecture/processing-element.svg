<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 335"><defs><marker id="007878" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#007878"/></marker><marker id="9a5712" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#9a5712"/></marker><marker id="516575" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#516575"/></marker></defs><rect width="100%" height="100%" fill="#f5f9f8"/><text x="24" y="34" font-family="Arial,sans-serif" font-size="24" fill="#18394b" font-weight="700">Inside a systolic processing element</text><text x="24" y="62" font-family="Arial,sans-serif" font-size="15" fill="#18394b" font-weight="400">Signed A_in and B_in feed two paths in the same cycle.</text><rect x="24" y="104" width="176" height="66" rx="6" fill="#18394b"/><text x="34" y="131" font-family="Arial,sans-serif" font-size="16" fill="white" font-weight="700">Operand format</text><text x="34" y="153" font-family="Arial,sans-serif" font-size="14" fill="white" font-weight="400">32-bit signed pair</text><rect x="235" y="104" width="176" height="66" rx="6" fill="#18394b"/><text x="245" y="131" font-family="Arial,sans-serif" font-size="16" fill="white" font-weight="700">Booth + Wallace</text><text x="245" y="153" font-family="Arial,sans-serif" font-size="14" fill="white" font-weight="400">16 recoded groups</text><rect x="448" y="104" width="176" height="66" rx="6" fill="#18394b"/><text x="458" y="131" font-family="Arial,sans-serif" font-size="16" fill="white" font-weight="700">CLA merge</text><text x="458" y="153" font-family="Arial,sans-serif" font-size="14" fill="white" font-weight="400">64-bit mac_out</text><rect x="24" y="206" width="176" height="66" rx="6" fill="#18394b"/><text x="34" y="233" font-family="Arial,sans-serif" font-size="16" fill="white" font-weight="700">posedge clk</text><text x="34" y="255" font-family="Arial,sans-serif" font-size="14" fill="white" font-weight="400">A_in and B_in</text><rect x="235" y="206" width="176" height="66" rx="6" fill="#18394b"/><text x="245" y="233" font-family="Arial,sans-serif" font-size="16" fill="white" font-weight="700">Forward registers</text><text x="245" y="255" font-family="Arial,sans-serif" font-size="14" fill="white" font-weight="400">A_out and B_out</text><rect x="448" y="206" width="176" height="66" rx="6" fill="#18394b"/><text x="458" y="233" font-family="Arial,sans-serif" font-size="16" fill="white" font-weight="700">Adjacent cells</text><text x="458" y="255" font-family="Arial,sans-serif" font-size="14" fill="white" font-weight="400">east and south</text><path d="M201 136 L232 136" stroke="#007878" stroke-width="2" marker-end="url(#007878)"/><path d="M412 136 L445 136" stroke="#007878" stroke-width="2" marker-end="url(#007878)"/><path d="M201 238 L232 238" stroke="#007878" stroke-width="2" marker-end="url(#007878)"/><path d="M412 238 L445 238" stroke="#007878" stroke-width="2" marker-end="url(#007878)"/><text x="24" y="308" font-family="Arial,sans-serif" font-size="16" fill="#18394b" font-weight="400">The wrapper samples each mac_out on enable and keeps its own 80-bit sum.</text></svg>